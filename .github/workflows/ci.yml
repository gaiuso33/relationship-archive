
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Build application
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Real PostgreSQL 17, the same major version as local development (compose.yaml).
    # These credentials belong to a throwaway database that exists only for this job:
    # they are not secrets and grant access to nothing else.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ra_ci
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: relationship_archive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ra_ci -d relationship_archive_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI uses one throwaway database for both the migration steps and the tests.
      DATABASE_URL: postgresql+psycopg://ra_ci:ci-only-throwaway-password@127.0.0.1:5432/relationship_archive_test
      TEST_DATABASE_URL: postgresql+psycopg://ra_ci:ci-only-throwaway-password@127.0.0.1:5432/relationship_archive_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code quality
        run: ruff check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Check models and migrations agree
        run: alembic check

      - name: Run tests
        run: pytest -q
