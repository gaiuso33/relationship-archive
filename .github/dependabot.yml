# Weekly dependency update pull requests. Decision and trade-offs: docs/security-checks.md.
#
# `groups` apply to version updates only, so a security update always arrives as its own
# pull request and is never hidden inside a group. Major versions are never grouped.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: ["type: chore", "area: frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: ["type: chore", "area: backend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Pinned tooling for the "Dependency audit" job (pip-audit).
  - package-ecosystem: pip
    directory: /.github/security
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 2
    labels: ["type: chore", "area: devops"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: ["type: chore", "area: devops"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 2
    labels: ["type: chore", "area: devops"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A PostgreSQL major version is an architecture decision (see docs/decisions), not a
      # routine bump. Minor and patch image updates are still proposed.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
